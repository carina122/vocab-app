server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In-cluster requests to /api are proxied to the backend Service.
    # BACKEND_HOST is resolved by Kubernetes DNS (e.g. wordbox-backend.wordbox.svc.cluster.local)
    location /api/ {
        proxy_pass http://20.170.98.228:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
