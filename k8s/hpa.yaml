apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wordbox-backend-hpa
  namespace: wordbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wordbox-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wordbox-frontend-hpa
  namespace: wordbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wordbox-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
